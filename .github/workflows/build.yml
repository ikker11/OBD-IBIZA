name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Montar proyecto
        run: |
          P=proyecto
          J=$P/app/src/main/java/com/ikker/obdibiza
          R=$P/app/src/main/res
          mkdir -p $J $R/xml $R/drawable $R/values
          # Si has subido el proyecto en .zip, se descomprime aquí
          for z in $(find . -name "*.zip" -not -path "./.git/*"); do unzip -o -q "$z" -d _zip; done
          busca() { find . -path ./$P -prune -o -name "$1" -type f -print | head -1; }

          for f in Params.kt Elm327.kt DtcInfo.kt ObdViewModel.kt MainActivity.kt Ui.kt; do
            src=$(busca $f); [ -n "$src" ] || { echo "FALTA $f"; exit 1; }; cp "$src" $J/
          done
          cp "$(busca AndroidManifest.xml)" $P/app/src/main/
          cp "$(busca device_filter.xml)" $R/xml/
          cp "$(busca ic_launcher.xml)" $R/drawable/
          cp "$(busca strings.xml)" $R/values/
          cp "$(busca themes.xml)" $R/values/
          K=$(busca obd-ibiza.keystore)
          if [ -n "$K" ]; then cp "$K" $P/app/; else
            keytool -genkeypair -keystore $P/app/obd-ibiza.keystore -storepass obdibiza -keypass obdibiza \
              -alias obdibiza -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=OBD Ibiza"; fi

          cat > $P/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral(); maven("https://jitpack.io") }
          }
          rootProject.name = "OBD-Ibiza"
          include(":app")
          EOF

          cat > $P/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > $P/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.ikker.obdibiza"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.ikker.obdibiza"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()
                  versionName = "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
                  vectorDrawables { useSupportLibrary = true }
              }
              signingConfigs {
                  create("fija") {
                      storeFile = file("obd-ibiza.keystore")
                      storePassword = "obdibiza"
                      keyAlias = "obdibiza"
                      keyPassword = "obdibiza"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("fija")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              lint { checkReleaseBuilds = false; abortOnError = false }
              packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
          }
          dependencies {
              implementation("com.github.mik3y:usb-serial-for-android:3.7.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.lifecycle:lifecycle-viewmod
